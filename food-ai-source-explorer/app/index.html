<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>식품 원재료 정보 탐색기</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>식품 원재료 정보 탐색기</h1>

  <p>
    공식 출처를 바탕으로 원재료 정보와 사용 조건을 확인합니다.
  </p>

  <label for="ingredient-input">원재료명</label>
  <input
    id="ingredient-input"
    type="text"
    placeholder="예: 대두, 쌀"
  >

  <button id="search-button">검색</button>
  <button id="reset-button">초기화</button>
  
  <div class="example-searches">
  <span>빠른 검색:</span>
  <button class="example-button" data-query="대두">대두</button>
  <button class="example-button" data-query="쌀">쌀</button>
  <button class="example-button" data-query="밀">밀</button>
</div>

  <div id="result-message">원재료명을 입력해 검색해 보세요.</div>
  <div class="next-page-area">
  <button id="previous-page-button" hidden>이전 10건 보기</button>
  <button id="next-page-button" hidden>다음 10건 보기</button>
</div>
  <script src="app.js"></script>
  
</body>
</html>

<p class="data-notice">
  <strong>안내:</strong><br> 검색 결과는 공식 원재료 정보 확인을 돕기 위한 자료입니다.<br>
  실제 제품 적용 가능 여부는 관련 기준과 전문가 검토가 필요합니다.
</p>
